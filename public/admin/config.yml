backend:
  name: github
  repo: rndchristi-cell/just-info
  branch: main
  base_url: https://just-info-bww.pages.dev
  auth_endpoint: /api/auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Artikel Blog"
    label_singular: "Artikel"
    folder: "src/content/blog"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - label: "Judul"
        name: "title"
        widget: "string"
        required: true

      - label: "Deskripsi"
        name: "description"
        widget: "text"
        required: true

      - label: "Kategori"
        name: "category"
        widget: "select"
        options:
          - "Umum"
          - "Teknologi"
          - "Bisnis"
          - "Tutorial"
          - "Tips"
        default: "Umum"
        required: true

      - label: "Tag"
        name: "tags"
        widget: "list"
        allow_add: true
        collapsed: false
        field:
          label: "Nama Tag"
          name: "tag"
          widget: "string"

      - label: "Tanggal Publish"
        name: "pubDate"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        required: true

      - label: "Banner - Gambar"
        name: "bannerImage"
        widget: "image"
        required: false

      - label: "Banner - Link Afiliasi"
        name: "bannerUrl"
        widget: "string"
        required: false
        hint: "Opsional. Gunakan URL lengkap, misalnya https://contoh.com/..."

      - label: "Banner - Posisi"
        name: "bannerPosisi"
        widget: "select"
        options:
          - "atas"
          - "tengah"
          - "sidebar"
        default: "atas"
        required: true

      - label: "Isi Artikel"
        name: "body"
        widget: "markdown"
        required: true
