backend:
  name: github
  repo: rndchristi-cell/just-info
  branch: main
  base_url: https://yourinfo.my.id
  auth_endpoint: /api/auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Artikel Blog"
    label_singular: "Artikel"
    folder: "src/content/blog"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - label: "Judul"
        name: "title"
        widget: "string"
        required: true

      - label: "Deskripsi"
        name: "description"
        widget: "text"
        required: true
        hint: "Deskripsi utama artikel. Jika SEO Description kosong, field ini dipakai untuk meta description."

      - label: "SEO Title"
        name: "seoTitle"
        widget: "string"
        required: false
        hint: "Opsional. Judul khusus untuk Google dan social sharing. Jika kosong, memakai Judul."

      - label: "SEO Description"
        name: "seoDescription"
        widget: "text"
        required: false
        hint: "Opsional. Deskripsi khusus SEO. Jika kosong, memakai Deskripsi."

      - label: "Author"
        name: "author"
        widget: "string"
        required: false
        default: "Just Info"

      - label: "Tanggal Publish"
        name: "pubDate"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        required: true

      - label: "Tanggal Update"
        name: "updatedDate"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        required: false
        hint: "Isi jika artikel mengalami pembaruan substansial."

      - label: "Kategori"
        name: "category"
        widget: "string"
        required: true
        hint: "Tulis nama kategori."

      - label: "Tag"
        name: "tags"
        widget: "list"
        allow_add: true
        collapsed: false
        field:
          label: "Nama Tag"
          name: "tag"
          widget: "string"

      - label: "Banner - Gambar"
        name: "bannerImage"
        widget: "image"
        required: false

      - label: "Banner - Link Afiliasi"
        name: "bannerUrl"
        widget: "string"
        required: false
        hint: "Opsional. Gunakan URL lengkap, misalnya https://contoh.com/..."

      - label: "Banner - Posisi"
        name: "bannerPosisi"
        widget: "select"
        options:
          - "atas"
          - "tengah"
          - "sidebar"
        default: "atas"
        required: true

      - label: "Noindex"
        name: "noindex"
        widget: "boolean"
        default: false
        required: false
        hint: "Aktifkan hanya jika artikel memang tidak ingin muncul di hasil pencarian."

      - label: "Isi Artikel"
        name: "body"
        widget: "markdown"
        required: true
